[project]
name = "windkraft-backend"
version = "0.1.0"
description = "WindKraft wind forecasting backend (local, single-site)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pandas>=3.0",
    "numpy>=2.0",
    "requests>=2.31",
    "pyarrow>=15",
    "joblib>=1.3",
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "lightgbm>=4.3",
    "turbine-models>=0.2",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
markers = [
    "network: test needs internet access",
    "slow: full-pipeline parity run (about 20 min); run with -m slow",
]
